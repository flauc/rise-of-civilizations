# Manual iOS build + App Store Connect upload.
# Submit for review is optional via the Run workflow checkbox.
#
# Required GitHub secrets — see mobile/README.md § Continuous deployment.

name: Publish iOS

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: App Store release notes (used only if submitting to App Store)
        required: true
        default: Bug fixes and improvements
      submit_for_review:
        description: Submit build to App Store for review (auto-release after approval)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-production-publish
  cancel-in-progress: false

env:
  IOS_APP_ID: com.riseofcivilizations.game
  IOS_SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
  IOS_RELEASE_NOTES: ${{ inputs.release_notes }}

jobs:
  publish-ios:
    name: iOS (App Store)
    # App Store Connect requires iOS 26 SDK (Xcode 26+) as of 2026.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            echo "Available Xcode installs:" >&2
            ls -1 /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install iOS signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash mobile/scripts/install-ios-signing.sh

      - name: Build web shell and sync Capacitor
        working-directory: mobile
        run: npm run build

      - name: Install CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Archive iOS app
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          IOS_CODE_SIGN_IDENTITY: ${{ env.IOS_CODE_SIGN_IDENTITY }}
          IOS_KEYCHAIN_PATH: ${{ env.IOS_KEYCHAIN_PATH }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
          test -n "$IOS_CODE_SIGN_IDENTITY" || { echo "Missing IOS_CODE_SIGN_IDENTITY from signing setup"; exit 1; }
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD:-roc-ci-keychain}" "$IOS_KEYCHAIN_PATH"
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
        run: |
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cp mobile/ios/ExportOptions.plist "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :teamID ${APPLE_TEAM_ID}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.riseofcivilizations.game ${IOS_PROFILE_NAME}" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_PLIST"
          echo "IPA_PATH=$RUNNER_TEMP/export/App.ipa" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        id: asc_api_key
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: bash mobile/scripts/prepare-appstore-api-key.sh

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ steps.asc_api_key.outputs.private_key }}
          wait-for-processing: "true"

      - name: Submit for App Store review
        if: inputs.submit_for_review
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          IOS_APP_ID: ${{ env.IOS_APP_ID }}
          IOS_SUBMIT_FOR_REVIEW: ${{ env.IOS_SUBMIT_FOR_REVIEW }}
          IOS_RELEASE_NOTES: ${{ env.IOS_RELEASE_NOTES }}
        run: bash mobile/scripts/submit-app-store-review.sh
