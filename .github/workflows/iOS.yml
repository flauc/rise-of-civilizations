name: Publish iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-production-publish
  cancel-in-progress: false

jobs:
  publish-ios:
    name: Build and publish iOS
    runs-on: macos-latest

    environment: ios-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy your iOS setup steps here.
      # Examples:
      #
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      #
      # - name: Install dependencies
      #   run: npm ci

      - name: Build iOS
        run: |
          echo "Replace this with your iOS build command"
          # Example:
          # npm run build:ios

      - name: Publish iOS
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Replace this with your App Store publishing command"
          # Example:
          # npm run publish:ios