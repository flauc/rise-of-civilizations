# Build and publish native Android + iOS apps when main is updated.
#
# Required GitHub secrets — see mobile/README.md § Continuous deployment.

name: Mobile release

on:
  push:
    branches: [main]

concurrency:
  group: mobile-release-main
  cancel-in-progress: true

env:
  PLAY_PACKAGE: com.riseofcivilizations.game
  # Google Play track: internal | alpha | beta | production
  PLAY_TRACK: production
  IOS_APP_ID: com.riseofcivilizations.game
  # After upload + processing, submit for App Store review (true) or upload only (false)
  IOS_SUBMIT_FOR_REVIEW: true
  # 1000+run*10+attempt: unique per workflow run and re-run (e.g. run 14 attempt 2 → 1142).
  MOBILE_BUILD_NUMBER: ${{ 1000 + github.run_number * 10 + github.run_attempt }}

jobs:
  android:
    name: Android (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Sync mobile version numbers
        run: node tools/sync-mobile-version.mjs

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/roc-release.keystore
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=roc-release.keystore" \
            > mobile/android/key.properties

      - name: Build release AAB
        working-directory: mobile
        run: npm run bundle:release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed

  ios:
    name: iOS (App Store)
    # App Store Connect requires iOS 26 SDK (Xcode 26+) as of 2026.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            echo "Available Xcode installs:" >&2
            ls -1 /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Sync mobile version numbers
        run: node tools/sync-mobile-version.mjs

      - name: Install iOS signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash mobile/scripts/install-ios-signing.sh

      - name: Build web shell and sync Capacitor
        working-directory: mobile
        run: npm run build

      - name: Install CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Archive iOS app
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          IOS_CODE_SIGN_IDENTITY: ${{ env.IOS_CODE_SIGN_IDENTITY }}
          IOS_KEYCHAIN_PATH: ${{ env.IOS_KEYCHAIN_PATH }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
          test -n "$IOS_CODE_SIGN_IDENTITY" || { echo "Missing IOS_CODE_SIGN_IDENTITY from signing setup"; exit 1; }
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD:-roc-ci-keychain}" "$IOS_KEYCHAIN_PATH"
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
        run: |
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cp mobile/ios/ExportOptions.plist "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :teamID ${APPLE_TEAM_ID}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.riseofcivilizations.game ${IOS_PROFILE_NAME}" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_PLIST"
          echo "IPA_PATH=$RUNNER_TEMP/export/App.ipa" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          wait-for-processing: "true"

      - name: Submit for App Store review
        if: env.IOS_SUBMIT_FOR_REVIEW == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_APP_ID: ${{ env.IOS_APP_ID }}
          IOS_SUBMIT_FOR_REVIEW: ${{ env.IOS_SUBMIT_FOR_REVIEW }}
        run: bash mobile/scripts/submit-app-store-review.sh
