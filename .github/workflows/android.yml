name: Publish Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-publish
  cancel-in-progress: false

jobs:
  publish-android:
    name: Build and publish Android
    runs-on: ubuntu-latest

    environment: android-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy your Android setup steps here.
      # Examples:
      #
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      #
      # - name: Install dependencies
      #   run: npm ci

      - name: Build Android
        run: |
          echo "Replace this with your Android build command"
          # Example:
          # npm run build:android

      - name: Publish Android
        env:
          ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
        run: |
          echo "Replace this with your Google Play publishing command"
          # Example:
          # npm run publish:android