# Manual Android build + Google Play upload.
#
# Required GitHub secrets — see mobile/README.md § Continuous deployment.

name: Publish Android

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Google Play release notes (What's new)
        required: true
        default: Bug fixes and improvements
      play_track:
        description: Google Play track
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
        default: production

permissions:
  contents: read

concurrency:
  group: android-production-publish
  cancel-in-progress: false

env:
  PLAY_PACKAGE: com.riseofcivilizations.game

jobs:
  publish-android:
    name: Android (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/roc-release.keystore
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=roc-release.keystore" \
            > mobile/android/key.properties

      - name: Build release AAB
        working-directory: mobile
        run: npm run bundle:release

      - name: Prepare Play release notes
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s\n' "${{ inputs.release_notes }}" > "$RUNNER_TEMP/whatsnew/en-US"
          echo "WHATSNEW_DIR=$RUNNER_TEMP/whatsnew" >> "$GITHUB_ENV"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}
