<!doctype html>
<html lang="en">
  <head>
    <script>
      window.__ROC_BOOT_ROUTE__ = (function () {
        var q = new URLSearchParams(location.search);
        var page = q.get("page");
        if (page === "support" || page === "privacy" || page === "terms" || page === "delete-account") return page;
        var path = location.pathname.replace(/\/$/, "").toLowerCase();
        var leaf = path.split("/").pop() || "";
        if (leaf === "privacy" || leaf === "privacy.html") return "privacy";
        if (leaf === "terms" || leaf === "terms.html") return "terms";
        if (leaf === "delete-account" || leaf === "delete-account.html") return "delete-account";
        if (leaf === "support" || leaf === "support.html") return "support";
        return null;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A turn-based 4X strategy game from the Ancient Era to the Age of Exploration."
    />
    <meta name="theme-color" content="#0f0e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rise of Civ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>Rise of Civilizations</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --bg: #0f0e0b;
        --bg-elevated: #181610;
        --bg-card: #1f1c14;
        --panel: rgba(31, 28, 20, 0.94);
        --edge: rgba(201, 162, 39, 0.28);
        --accent: #c9a227;
        --accent-bright: #f0d878;
        --parchment: #e8dcc5;
        --parchment-dim: #b8aa8d;
        --danger: #8a2c2c;
        --success: #4a6e46;
        /* One title scale for every dialog that opens over the map. Full-screen
           pages (changelog, credits, roadmap, legal, support) keep their own
           larger page-title scale. */
        --dialog-title-size: 18px;
        /* The pinned ✕ is --dialog-x-size square, inset from the dialog's
           padding box, so it eats (right-inset + size) = 48px of the right edge.
           Titles reserve --dialog-x-gutter to clear it horizontally; headers
           reserve --dialog-x-size of height so body content, which scrolls,
           can't pass under it. */
        --dialog-x-size: 34px;
        --dialog-x-top: 12px;
        --dialog-x-right: 14px;
        --dialog-x-gutter: 44px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--parchment);
      }
      body.roc-native {
        min-height: 100%;
        background: #0f0e0b;
      }
      h1, h2, h3, h4 {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        margin: 0 0 0.4em;
      }
      #game {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        /* dvh tracks the *visible* viewport as the mobile browser's toolbar
           shows/hides; plain vh is locked to the larger viewport, leaving a
           black strip below the map. 100vh stays as the fallback above. */
        height: 100dvh;
        touch-action: none;
        background: var(--bg);
      }
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--parchment);
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 8px 16px;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .btn:hover {
        background: rgba(201, 162, 39, 0.12);
        border-color: var(--accent);
        color: var(--accent-bright);
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), #a6821f);
        border-color: transparent;
        color: #15120c;
      }
      .btn.primary:hover {
        background: linear-gradient(135deg, var(--accent-bright), var(--accent));
        color: #0f0e0b;
        box-shadow: 0 8px 24px rgba(201, 162, 39, 0.25);
      }
      /* Tile-improvement build buttons: name on top, yield preview beneath. */
      .imp-btn {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        border-radius: 12px;
        padding: 6px 12px;
        text-align: left;
      }
      .imp-btn .imp-name {
        line-height: 1.15;
      }
      .imp-prev {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0;
        opacity: 0.8;
      }
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.5;
        user-select: none;
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }
      .panel b {
        color: var(--parchment);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      /* Top status bar — stretches from the leader avatar to the right edge */
      #topbar {
        top: max(6px, env(safe-area-inset-top));
        left: calc(96px + env(safe-area-inset-left));
        right: max(6px, env(safe-area-inset-right));
        transform: none;
        max-width: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 14px;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        z-index: 20;
      }
      #leader-avatar {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        width: 84px;
        z-index: 21;
        display: flex;
        flex-direction: column;
      }
      #leader-avatar.empty {
        display: none;
      }
      #leader-avatar > img {
        width: 84px;
        /* Leader art is 1.6:2; derive the height so nothing gets cropped. */
        height: auto;
        aspect-ratio: 1.6 / 2;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--edge);
        background: var(--bg-card);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #leader-avatar .leader-avatar-label {
        margin-top: 4px;
        text-align: center;
        font-size: 10px;
        color: var(--parchment);
        line-height: 1.2;
      }
      #leader-avatar .leader-avatar-label span {
        display: block;
        color: var(--parchment-dim);
      }
      .tb-grp {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tb-turn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        color: var(--accent-bright);
      }
      .tb-map {
        font-size: 11px;
        font-weight: 600;
        color: var(--parchment-dim);
        max-width: 30vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        .tb-map {
          display: none;
        }
      }
      .tb-civ {
        max-width: 38vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tb-pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: inherit;
        color: var(--parchment);
        background: rgba(201, 162, 39, 0.08);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 5px 10px 7px;
        cursor: pointer;
        max-width: 160px;
        overflow: hidden;
      }
      .tb-pill b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tb-pill::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: var(--p, 0%);
        background: var(--accent);
        border-radius: 0 2px 2px 0;
      }
      .tb-pill.civic::after {
        background: #c07ad0;
      }
      .tb-pl {
        opacity: 0.8;
      }
      .tb-score {
        margin-left: 4px;
        font-size: 11px;
        color: var(--parchment-dim);
        font-weight: 600;
      }
      .tb-div {
        opacity: 0.5;
        margin: 0 2px;
      }
      .tb-pill.empire {
        background: rgba(201, 162, 39, 0.12);
        gap: 4px;
      }
      /* shared small text + cost chips used in panels/modals */
      .sub {
        color: var(--parchment-dim);
        font-size: 11.5px;
        line-height: 1.35;
      }
      .cost {
        color: var(--parchment);
        white-space: nowrap;
        font-size: 12px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      /* Selected-unit panel */
      #unit-panel {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        min-width: 180px;
        max-height: min(70vh, 520px);
        overflow: auto;
        z-index: 10;
      }
      /* Shared collapsible summary bar for the docked info panels (unit / tile /
         city). The bar is always the tap target that expands/collapses the panel;
         the detail body hides when the panel carries the .collapsed class. */
      .ip-summary {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        text-align: left;
      }
      .ip-icon {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        object-fit: contain;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
      }
      .ip-name {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ip-name b {
        color: var(--parchment);
      }
      .ip-stats {
        display: flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
        font-size: 12px;
        color: #9fc0dc;
      }
      .ip-close {
        flex: 0 0 auto;
        padding: 2px 7px;
        font-size: 13px;
      }
      .ip-chevron {
        flex: 0 0 auto;
        color: var(--parchment-dim);
        transition: transform 0.15s ease;
      }
      .panel:not(.collapsed) .ip-chevron {
        transform: rotate(180deg);
      }
      .panel.collapsed .ip-detail {
        display: none;
      }
      /* Quick-cast ability icons — sit inline in the collapsed summary bar (beside
         the name/stats) so a unit's abilities can be fired without expanding and
         without adding any extra height. Hidden when expanded, where the full
         labelled buttons live. */
      .ip-quick {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel:not(.collapsed) .ip-quick {
        display: none;
      }
      .ip-quick-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 5px;
        line-height: 1;
      }
      .panel:not(.collapsed) .ip-detail {
        margin-top: 10px;
      }
      .panel.collapsed {
        max-height: none !important;
        overflow: visible !important;
      }
      /* Selected-tile panel (shares the bottom-left slot with the unit panel) */
      #tile-panel {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 300px;
        z-index: 10;
      }
      /* Tile names ("Grassland · Barbarian Camp") are long; let the summary bar
         title wrap to a second line here instead of truncating with an ellipsis. */
      #tile-panel .ip-name {
        white-space: normal;
        overflow: visible;
      }
      .tinfo-yields {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 6px;
        padding: 6px 8px;
        background: rgba(201, 162, 39, 0.08);
        border-radius: 8px;
      }
      .tinfo-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        line-height: 1.5;
      }
      .tinfo-list li {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .tinfo-good {
        color: #a3d9a8;
      }
      .tinfo-bad {
        color: #e0a69a;
      }
      .tinfo-neutral {
        color: var(--parchment-dim);
      }
      #tile-panel .tinfo-toggle {
        margin-top: 8px;
        width: 100%;
      }
      /* Hover tooltip — limited tile info, docked in the bottom-right corner
         so it never covers the map under the cursor */
      #tile-tip {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 30;
        pointer-events: none;
        background: rgba(8, 16, 26, 0.92);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 11px;
        font-size: 13px;
        line-height: 1.35;
        white-space: nowrap;
        text-shadow: 0 1px 2px #000;
      }
      #tile-tip b {
        color: #fff;
      }
      #tile-tip .tt-rough {
        color: #e0b07d;
      }
      #tile-tip .tt-open {
        color: var(--parchment-dim);
      }
      /* City panel */
      #city-panel {
        right: max(12px, env(safe-area-inset-right));
        top: calc(150px + env(safe-area-inset-top));
        width: 320px;
        /* Fill the space below the panel's 150px top offset (with a small bottom
           gap), capped so it never gets absurdly tall — removes the desktop
           scroll while staying on-screen on short displays. */
        max-height: min(calc(100vh - 172px), 820px);
        overflow: auto;
        z-index: 10;
      }
      .ygrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 10px;
        margin-top: 6px;
        padding: 5px 8px;
        background: rgba(201, 162, 39, 0.08);
        border-radius: 8px;
      }
      /* Compact rows inside the docked panels */
      .cline {
        margin-top: 6px;
        font-size: 12px;
        color: #9fc0dc;
      }
      .cline b {
        color: var(--parchment);
      }
      /* Secondary button that opens a sub-dialog (Choose Production / Specialists) */
      .csheet-btn {
        width: 100%;
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        text-align: left;
      }
      /* Left group: a fixed-width icon cell keeps every label's text starting at the
         same x, so "Construction / Train Units / Specialists" line up in a column. */
      .csheet-btn .cs-l {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .csheet-btn .ci {
        flex: 0 0 1.35em;
        text-align: center;
        font-size: 15px;
      }
      .csheet-btn .sub {
        font-weight: 400;
        color: #cfe3f7;
        flex: 0 0 auto;
      }
      /* Build-progress line with rush buttons tucked to the right of the label. */
      .build-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .build-row > span:first-child {
        min-width: 0;
      }
      .rush-inline {
        display: inline-flex;
        gap: 4px;
        flex: 0 0 auto;
      }
      .rush-mini {
        padding: 3px 7px;
        font-size: 11px;
        white-space: nowrap;
      }
      /* Tab bar for the construction dialog */
      .ptabs {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .ptab {
        flex: 1;
        padding: 7px 4px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        text-align: center;
      }
      .ptab.active {
        background: rgba(201, 162, 39, 0.16);
        border-color: var(--accent);
        color: var(--parchment);
      }
      #endturn2 {
        position: fixed;
        left: calc(50% + 10px);
        transform: none;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 25;
        width: 34px;
        height: 34px;
      }
      .action-btn {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        cursor: pointer;
        padding: 0;
        transition: filter 0.08s ease, transform 0.08s ease;
      }
      .action-btn:hover {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.28)) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.4));
        transform: translateY(-1px);
      }
      .action-btn:active {
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.15)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
        transform: translateY(1px);
      }
      .action-next {
        background-image: url("/ui/btn_next_move.png");
      }
      .action-skip {
        background-image: url("/ui/btn_skip_move.png");
      }
      #city-panel select {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--parchment);
        border: 1px solid var(--edge);
      }
      .bar {
        height: 8px;
        background: rgba(201, 162, 39, 0.15);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      /* End turn / next move buttons */
      #endturn {
        position: fixed;
        left: calc(50% - 44px);
        transform: none;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 25;
      }
      /* Victory / defeat overlay */
      #gameover {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: rgba(15, 14, 11, 0.92);
        z-index: 60;
        text-align: center;
      }
      #gameover .go-panel {
        display: flex;
        flex-direction: column;
        width: min(520px, 100%);
        max-height: min(88vh, calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(36, 32, 24, 0.98), rgba(22, 20, 16, 0.98));
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #gameover .go-scroll {
        flex: 1;
        overflow: auto;
        padding: 22px 20px 12px;
      }
      #gameover .title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: clamp(28px, 7vw, 40px);
        font-weight: 800;
        color: var(--accent-bright);
        margin-bottom: 8px;
      }
      #gameover .sub {
        color: var(--parchment);
        font-size: 15px;
        line-height: 1.45;
        margin-bottom: 18px;
      }
      #gameover .go-section-title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #c9a227;
        margin: 16px 0 10px;
        text-align: left;
      }
      #gameover .go-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        text-align: left;
      }
      #gameover .go-stat {
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
      }
      #gameover .go-stat-label {
        font-size: 11px;
        color: #9fc0dc;
        margin-bottom: 4px;
      }
      #gameover .go-stat-value {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--parchment);
        line-height: 1.1;
      }
      #gameover .go-stat-hint {
        font-size: 10px;
        color: #9fc0dc;
        margin-top: 4px;
      }
      #gameover .go-standings {
        text-align: left;
      }
      #gameover .go-row {
        width: 100%;
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      #gameover .go-row:hover {
        border-color: rgba(201, 162, 39, 0.55);
        background: rgba(201, 162, 39, 0.06);
      }
      #gameover .go-row.go-row-selected {
        border-color: #c9a227;
        background: rgba(201, 162, 39, 0.12);
        box-shadow: inset 0 0 0 1px rgba(201, 162, 39, 0.25);
      }
      #gameover .go-portrait-wrap {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        overflow: hidden;
        flex-shrink: 0;
        background: rgba(0, 0, 0, 0.25);
      }
      #gameover .go-civ-portrait {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #gameover .go-civ-portrait-fallback {
        width: 100%;
        height: 100%;
      }
      #gameover .go-hint {
        margin-top: 10px;
        font-size: 12px;
        color: #9fc0dc;
        text-align: left;
        font-style: italic;
      }
      #gameover .go-vic {
        text-align: left;
      }
      #gameover .go-vic-won {
        border: 1px solid #c9a227;
        border-radius: 10px;
        background: rgba(201, 162, 39, 0.1);
        padding: 8px 10px;
      }
      #gameover .go-actions {
        display: flex;
        gap: 10px;
        padding: 14px 16px max(14px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--edge);
        background: rgba(0, 0, 0, 0.18);
      }
      #gameover .go-actions .btn {
        flex: 1;
        font-size: 15px;
        padding: 12px 14px;
      }
      #gameover-explore-bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(14px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(15, 14, 11, 0.92);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        z-index: 61;
      }
      #gameover-explore-bar .btn {
        font-size: 14px;
        padding: 10px 16px;
        white-space: nowrap;
      }
      #game-hud.game-over-map #topbar,
      #game-hud.game-over-map #endturn,
      #game-hud.game-over-map #endturn2,
      #game-hud.game-over-map #log,
      #game-hud.game-over-map #tile-tip:not(.hidden),
      #game-hud.game-over-map #empire:not(.hidden),
      #game-hud.game-over-map #diplomacy:not(.hidden) {
        display: none !important;
      }
      /* Research / civics / religion / great people / production / save modal */
      #save-modal {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        max-height: 80vh;
        overflow: auto;
        z-index: 40;
      }
      /* Top-bar pickers: below the status bar so the map and end-turn stay reachable */
      #research,
      #civics,
      #religion {
        left: 50%;
        top: max(68px, calc(52px + env(safe-area-inset-top)));
        transform: translateX(-50%);
        width: 320px;
        max-height: min(420px, calc(100vh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        overflow: hidden;
        z-index: 40;
      }
      /* Research grows to the standard 80% on desktop so long tech lists don't
         squeeze into a stubby 420px box. */
      #research {
        max-height: min(80vh, calc(100vh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
      }
      /* Clear both the close button and the "View full" button beside it. */
      #research .panel-dialog-header {
        padding-right: 158px;
      }
      /* Great People & Legends — richer cards, wider/taller panels. */
      #great-people,
      #legends {
        left: 50%;
        top: max(68px, calc(52px + env(safe-area-inset-top)));
        transform: translateX(-50%);
        width: min(440px, calc(100vw - 24px));
        max-height: calc(100vh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow: hidden;
        z-index: 40;
      }
      /* Legends earns extra width on desktop: progress on the left, a grid of
         hero cards on the right. Mobile narrows it back below. */
      #legends {
        width: min(980px, calc(100vw - 32px));
      }
      #production,
      #specialists,
      #training {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        max-height: 80vh;
        overflow: auto;
        z-index: 40;
      }
      #god-panel {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(320px, calc(100vw - 32px));
        max-height: min(520px, 80vh);
        z-index: 40;
      }
      #save-modal input.lobby-in {
        font: inherit;
        font-size: 13px;
        color: var(--parchment);
        background: var(--bg-card);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 7px 10px;
        user-select: text;
        -webkit-user-select: text;
      }
      .tech .sub {
        margin-top: 2px;
      }
      .tech .cost {
        margin-left: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
      }
      /* Turns-to-complete estimate under each tech's science cost. */
      .tech .cost .tech-eta {
        margin-top: 0;
        font-size: 10.5px;
        white-space: nowrap;
      }
      #production,
      #specialists,
      #training,
      #god-panel,
      #research,
      #civics,
      #religion,
      #great-people,
      #legends {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-dialog-header {
        flex: none;
      }
      .panel-dialog-header .row > b {
        min-width: 0;
        padding-right: 8px;
      }
      .panel-dialog-body {
        flex: 1;
        overflow: auto;
        margin-top: 8px;
        padding-right: 2px;
        min-height: 0;
      }
      /* Train-units building families — header-only until expanded */
      .train-fold {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        margin-top: 8px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.15);
        cursor: pointer;
        font: inherit;
        color: var(--parchment);
        text-align: left;
      }
      .train-fold:hover {
        background: rgba(201, 162, 39, 0.1);
        border-color: var(--accent);
      }
      .train-fold-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .train-fold-label b {
        color: var(--parchment);
      }
      .train-fold .train-chevron {
        flex: 0 0 auto;
        opacity: 0.7;
        transition: transform 0.15s;
      }
      .train-fold.open .train-chevron {
        transform: rotate(90deg);
      }
      .train-fold-body {
        display: none;
        padding: 6px 0 4px 4px;
      }
      .train-fold.open + .train-fold-body {
        display: block;
      }
      /* production cards */
      .pcard {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        margin-top: 7px;
        cursor: pointer;
      }
      .pcard:hover {
        background: rgba(201, 162, 39, 0.1);
        border-color: var(--accent);
      }
      .pcard.locked {
        cursor: default;
        opacity: 0.5;
        border-style: dashed;
      }
      .pcard.locked:hover {
        background: none;
        border-color: var(--edge);
      }
      .locked-note {
        margin-top: 10px;
        padding: 10px 12px;
        background: rgba(138, 44, 44, 0.12);
        border: 1px solid rgba(138, 44, 44, 0.4);
        border-radius: 8px;
        color: #e6d2b8;
        font-size: 13px;
      }
      /* Full tech tree */
      #techtree {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 94vw;
        height: 88vh;
        max-height: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        z-index: 41;
      }
      #techtree > div:first-child,
      #techtree .panel-dialog-header {
        flex: none;
      }
      #techtree .tt-scroll {
        margin-top: 8px;
      }
      #techtree > div:last-child,
      #techtree .panel-dialog-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      .tt-node {
        position: absolute;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 12px;
        border: 2px solid var(--edge);
        background: var(--bg-card);
        overflow: hidden;
      }
      .tt-name {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tt-cost {
        font-size: 11px;
        color: var(--parchment-dim);
      }
      .tt-unlocks {
        margin-top: 3px;
        font-size: 10.5px;
        line-height: 1.3;
        color: var(--parchment-dim);
        max-height: 40px;
        overflow: hidden;
      }
      .tt-done {
        border-color: #4a9a4e;
        background: rgba(74, 158, 78, 0.12);
      }
      .tt-researching {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.25);
      }
      .tt-available {
        border-color: var(--accent);
        cursor: pointer;
      }
      .tt-available:hover {
        background: rgba(201, 162, 39, 0.1);
      }
      .tt-queued {
        border-color: var(--accent);
        border-style: dashed;
        cursor: pointer;
      }
      .tt-queued:hover {
        background: rgba(201, 162, 39, 0.08);
      }
      .tt-locked {
        opacity: 0.5;
      }
      /* edges */
      .tt-edge {
        stroke: #3a5269;
        opacity: 0.5;
        transition: opacity 0.1s, stroke 0.1s;
      }
      .tt-edge-done {
        stroke: #4a8a4e;
        opacity: 0.75;
      }
      .tt-edge-hl {
        stroke: #ffd967 !important;
        opacity: 1 !important;
        stroke-width: 3 !important;
      }
      .tt-edge-dim {
        opacity: 0.06 !important;
      }
      /* prerequisite-chain highlight */
      .tt-node.tt-hl {
        opacity: 1 !important;
        border-color: #ffd967 !important;
        box-shadow: 0 0 0 2px rgba(255, 217, 103, 0.35);
        z-index: 2;
      }
      .tt-node.tt-dim {
        opacity: 0.16 !important;
      }
      /* Your civilization's unique unlocks (unit / building / leader ability).
         A violet outline + crown badge mark the tech, and the unlock entry
         itself is tinted so it reads as civ-specific. Uses outline (not border)
         so the node's status colour still shows through. */
      .tt-node.tt-civ {
        outline: 2px solid rgba(199, 146, 234, 0.85);
        outline-offset: 1px;
      }
      .tt-civ .tt-name {
        padding-right: 18px;
      }
      .tt-civ-badge {
        position: absolute;
        top: 5px;
        right: 7px;
        font-size: 12px;
        line-height: 1;
        pointer-events: none;
      }
      .tt-unlocks .tt-civ-unlock {
        color: #dcbcff;
        font-weight: 600;
      }
      .csub {
        margin-top: 10px;
        margin-bottom: 2px;
        color: var(--accent-bright);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #civics .row {
        gap: 6px;
      }
      /* Stat line that carries the governor chip on its right edge. */
      .cline-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .cline-hdr > span:first-child {
        min-width: 0;
      }
      .cline-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }
      /* Small round icon button on the stat line (e.g. the expand-tile flag). */
      .mini-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 7px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .mini-btn:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .mini-btn.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
      }
      /* Bombard button pulses subtly when a shot is available this turn. */
      .mini-btn.bombard-ready {
        border-color: #e0763d;
        background: rgba(224, 118, 61, 0.16);
      }
      .mini-btn.bombard-ready:hover {
        border-color: #ff8a4a;
        background: rgba(224, 118, 61, 0.28);
      }
      .mini-btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Collapsed governor control: a single pill showing the active mode; tapping it
         expands the full picker (.gov-row) below. Keeps the panel compact by default. */
      .gov-chip {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .gov-chip .gi {
        font-size: 13px;
      }
      .gov-chip .gov-caret {
        color: var(--parchment-dim);
        font-size: 9px;
      }
      .gov-chip:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .gov-chip.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
      }
      /* Governor (city auto-mode) picker: a compact 5-across segmented control
         that stays one tidy row on both the 300px desktop panel and the
         full-width mobile bottom sheet — icon over a short label. */
      .gov-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin-top: 4px;
      }
      .gov-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 7px 2px;
        min-height: 44px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 10px;
        line-height: 1.1;
        cursor: pointer;
        user-select: none;
        text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .gov-btn .gi {
        font-size: 15px;
        line-height: 1;
      }
      .gov-btn:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .gov-btn.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
        font-weight: 700;
      }
      .gov-note {
        margin-top: 5px;
        font-size: 11px;
        color: #9fc0dc;
      }
      .tech {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        margin-top: 6px;
        cursor: pointer;
      }
      .tech:hover {
        background: rgba(201, 162, 39, 0.1);
      }
      .portrait-thumb {
        width: 44px;
        height: 55px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--edge);
        margin-right: 8px;
        flex-shrink: 0;
      }
      /* Legends panel — larger portraits and readable copy on desktop & mobile. */
      #legends .panel-dialog-body {
        font-size: 13px;
        line-height: 1.45;
      }
      #legends .sub {
        font-size: 12.5px;
        line-height: 1.45;
      }
      #legends .csub {
        font-size: 13px;
        margin-top: 12px;
      }
      #legends .legend-card {
        align-items: flex-start;
        gap: 12px;
        padding: 11px 12px;
        margin-top: 10px;
        border-radius: 12px;
        cursor: default;
      }
      #legends .legend-card:hover {
        background: rgba(201, 162, 39, 0.08);
      }
      #legends .legend-card > div:first-of-type b,
      #legends .legend-card b {
        font-size: 15px;
        line-height: 1.3;
      }
      #legends .legend-portrait {
        width: 68px;
        height: 86px;
        border-radius: 8px;
        margin-right: 0;
        object-position: 50% 15%;
      }
      #legends .legend-portrait-sm {
        width: 52px;
        height: 66px;
      }
      #legends .legend-active {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
      }
      #legends .legend-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      /* Two-column shell: fixed progress rail on the left, hero grid on the right. */
      #legends .legends-layout {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        gap: 18px;
        align-items: start;
      }
      #legends .legends-progress {
        min-width: 0;
      }
      #legends .legends-heroes {
        min-width: 0;
      }
      #legends .legend-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 12px;
        margin-top: 6px;
      }
      /* Collapsible "How legends work" explainer, mirroring the morale dialog. */
      #legends .legend-help-toggle {
        margin-top: 10px;
        width: 100%;
        text-align: left;
      }
      #legends .legend-help {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.15);
        font-size: 12px;
        line-height: 1.5;
        color: var(--parchment-dim);
      }
      #legends .legend-help p {
        margin: 0 0 7px;
      }
      #legends .legend-help p:last-child {
        margin-bottom: 0;
      }
      #legends .legend-help b {
        color: var(--parchment);
      }
      /* Standardised legend card: a big portrait on the side, with the title,
         chips, and Ability / Aura / Earn Turns sections stacked beside it. */
      #legends .legend-grid .legend-card {
        margin: 0;
        flex-direction: row;
        align-items: flex-start;
        gap: 14px;
      }
      #legends .legend-grid .legend-portrait {
        width: 104px;
        height: 132px;
      }
      #legends .legend-card-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #legends .legend-card-title {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      #legends .legend-card-title b {
        font-size: 15px;
        line-height: 1.25;
      }
      #legends .legend-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }
      #legends .lchip {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 999px;
        background: rgba(201, 162, 39, 0.14);
        border: 1px solid var(--edge);
        color: var(--parchment);
        white-space: nowrap;
      }
      #legends .legend-sec {
        margin-top: 8px;
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--parchment);
      }
      #legends .legend-sec-h {
        display: block;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent-bright);
        margin-bottom: 1px;
      }
      #legends .legend-actions-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 10px;
      }
      #legends .legend-actions-row .btn.primary {
        flex: 1;
      }
      /* Great People panel — larger portraits and readable copy. */
      #great-people .panel-dialog-body {
        font-size: 13px;
        line-height: 1.45;
      }
      #great-people .sub {
        font-size: 12.5px;
        line-height: 1.45;
      }
      #great-people .csub {
        font-size: 13px;
        margin-top: 12px;
      }
      #great-people .gp-card {
        align-items: flex-start;
        gap: 12px;
        padding: 11px 12px;
        margin-top: 10px;
        border-radius: 12px;
        cursor: default;
      }
      #great-people .gp-card:hover {
        background: rgba(201, 162, 39, 0.08);
      }
      #great-people .gp-card b {
        font-size: 15px;
        line-height: 1.3;
      }
      #great-people .gp-portrait {
        width: 68px;
        height: 86px;
        border-radius: 8px;
        margin-right: 0;
        object-fit: cover;
        object-position: 50% 15%;
        border: 1px solid var(--edge);
        flex-shrink: 0;
      }
      #great-people .gp-portrait-sm {
        width: 52px;
        height: 66px;
      }
      #great-people .gp-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      #great-people .gp-progress {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.12);
      }
      #great-people .gp-progress-body {
        flex: 1;
        min-width: 0;
      }
      #great-people .gp-progress-body b {
        font-size: 15px;
      }
      /* transient banner */
      #banner {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translateX(-50%);
        font-family: 'Cinzel', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--parchment);
        background: rgba(31, 28, 20, 0.92);
        border: 1px solid var(--edge);
        padding: 12px 22px;
        border-radius: 16px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #banner.show {
        opacity: 1;
      }
      /* Touch / narrow: shrink so the turn banner keeps to a single line. */
      @media (max-width: 860px), (pointer: coarse) {
        #banner {

      /* The one top-right ✕ for every dialog that opens over the map: treasury,
         morale, diplomacy, empire, the city sub-dialogs, unique-unit cards. Add
         .dialog-title (or .panel-dialog-header) to the title beside it and the
         gutter is reserved for you. */
      .dialog-x {
        position: absolute;
        top: var(--dialog-x-top);
        right: var(--dialog-x-right);

        height: var(--dialog-x-size);

        line-height: 1;
        cursor: pointer;

        z-index: 1;
        transition: background 0.15s ease, color 0.15s ease;

      /* Every in-game dialog title, one scale. Keep this list and the header-band

      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title,
      #settings-dialog .settings-header b,
      #combat-preview-dialog .combat-preview-header b,
      #village-dialog .village-title,
      #gp-activate-dialog .gp-activate-title,
      #leader-ability-dialog .la-dialog-title,
      #turn-update-dialog .turn-update-title,

      .emp-title,

        font-size: var(--dialog-title-size);
        font-weight: 700;
        color: var(--accent-bright);
      }
      /* The header band a pinned ✕ shares. min-height holds the row open to the
         button's height, so the scrolling body beneath can't pass under it, and
         the gutter keeps the title text clear of it. */
      .dialog-title,
      .panel-dialog-header,
      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title,

        padding-right: var(--dialog-x-gutter);

         headers left out here lay their own children out in a row. */

      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,

        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #combat-preview-dialog .combat-preview-mod:last-child {
        border-bottom: none;
      }
      #combat-preview-dialog .combat-preview-mod-effect {
        color: #9fc0dc;
        text-align: right;
        flex-shrink: 0;
      }
      #combat-preview-dialog .combat-preview-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      #combat-preview-dialog .combat-preview-actions .btn.primary {
        min-width: 100px;
      }
      @media (max-width: 520px) {
        /* Every dialog title steps down together on phones, rather than each
           dialog picking its own mobile size. */
        :root {
          --dialog-title-size: 17px;
        }
        #combat-preview-dialog .combat-preview-matchup {
          grid-template-columns: 1fr;
        }
        #combat-preview-dialog .combat-preview-vs {
          padding-top: 0;
          text-align: center;
        }
      }
      .rotation-controls {
        margin-top: 14px;
      }
      .rotation-controls-label {
        font-size: 12px;
        color: #b8aa8d;
        margin-bottom: 8px;
      }
      .rotation-seg {
        display: flex;
        border: 1px solid var(--edge);
        border-radius: 999px;
        overflow: hidden;
      }
      .rotation-seg-btn {
        flex: 1;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 12px;
        border: none;
        background: transparent;
        color: #b8aa8d;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .rotation-seg-btn + .rotation-seg-btn {
        border-left: 1px solid var(--edge);
      }
      .rotation-seg-btn.active {
        background: linear-gradient(135deg, #c9a227, #a6821f);
        color: #15120c;
      }
      .hidden {
        display: none !important;
      }
      /* Art whose new source has not decoded yet: keeps its box so the dialog
         does not resize, but paints nothing rather than the previous picture. */
      .art-pending {
        visibility: hidden;
      }

      #bottom-bar {
        display: none;
      }

      /* In-game HUD shell — canvas stays full-screen; overlays live here.
         pointer-events: none lets map taps pass through; each panel/overlay sets
         its own auto/none (hidden full-screen overlays must stay none). */
      #game-hud {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      /* Loading veil hides the HUD; never leave it stuck after dismiss. */
      body.roc-loading-scroll #game-hud {
        opacity: 0;
        pointer-events: none;
      }
      #game-hud .panel:not(.hidden),
      #game-hud .action-btn,
      #game-hud #leader-avatar:not(.empty),
      #game-hud #log,
      #game-hud #tile-tip:not(.hidden),
      #game-hud #game-chat,
      #game-hud #empire:not(.hidden),
      #game-hud #diplomacy:not(.hidden),
      #game-hud #diplo-contact.show,
      #game-hud #diplo-proposal.show,
      #game-hud #gameover:not(.hidden),
      #game-hud #gameover-explore-bar:not(.hidden) {
        pointer-events: auto;
      }

      /* Touch / tablet: one universal HUD scale (same on every phone & tablet).
         Reference width 400px; cap at 0.9 so normal phones and tablets match. */
      @media (pointer: coarse), (max-width: 860px) {
        #game-hud {
          --hud-scale: min(0.9, 100vw / 400px);
          width: calc(100vw / var(--hud-scale));
          height: calc(100dvh / var(--hud-scale));
          transform: scale(var(--hud-scale));
          transform-origin: top left;
        }
      }
      /* Portrait phones: skip HUD scaling — it warps fixed overlays and wastes map space. */
      @media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 860px) {
        #game-hud {
          --hud-scale: 1;
          width: 100%;
          height: 100%;
          transform: none;
        }
      }

      /* Native / touch: keep the map inside the safe area (notch, home bar). */
      @media (max-width: 860px), (pointer: coarse) {
        #game {
          top: env(safe-area-inset-top, 0px);
          left: env(safe-area-inset-left, 0px);
          right: env(safe-area-inset-right, 0px);
          bottom: env(safe-area-inset-bottom, 0px);
          width: auto;
          height: auto;
        }
      }

      /* ---- mobile / narrow screens: panels become bottom sheets ---- */
      @media (max-width: 860px), (pointer: coarse) {
        #topbar {
          display: flex;
          flex-wrap: wrap;
          align-items: flex-start;
          justify-content: flex-start;
          gap: 6px 8px;
          padding: 6px 10px;
          top: max(6px, env(safe-area-inset-top));
          /* Gutter for the leader portrait: 6px inset + its 60px max width + gap.
             Static on purpose, so the portrait sizing off #topbar's height can't
             feed back into the bar's width and change how its pills wrap. */
          left: calc(72px + env(safe-area-inset-left));
          right: max(6px, env(safe-area-inset-right));
          font-size: 13px;
        }
        /* Turn number above civ name; resource pills on the row below. */
        #topbar .tb-grp:first-child {
          flex-direction: column;
          align-items: flex-start;
          gap: 1px;
          flex: 1 1 auto;
          min-width: 0;
        }
        #topbar .tb-turn {
          font-size: 12px;
          line-height: 1.15;
        }
        /* Empire group (cities/units/etc.) lives in the bottom bar on mobile. */
        #topbar .tb-grp:nth-child(3) {
          display: none;
        }
        /* Resource group (gold/research/civics/religion/morale) stays in the
           top bar but compacted: drop the long tech/civic names, keep icons
           and per-turn scores. */
        #topbar .tb-res {
          flex: 1 1 100%;
          gap: 4px;
        }
        #topbar .tb-res .tb-pill {
          max-width: none;
          padding: 4px 8px 5px;
          gap: 3px;
        }
        #topbar #research-btn b,
        #topbar #civics-btn b {
          display: none;
        }
        /* Shrink the resource numbers so a big gold/faith balance doesn't push
           the resource pills past the top bar's width. */
        #topbar .tb-res .tb-pill b {
          font-size: 11px;
        }
        #topbar .tb-score {
          margin-left: 2px;
          font-size: 9px;
        }
        /* The resources wrap onto their own row, so the player/civ label keeps
           the full width of the first row (only truncating very long names). */
        .tb-civ {
          max-width: 64vw;
        }
        #leader-avatar {
          display: flex;
          flex-direction: column;
          align-items: center;
          position: fixed;
          top: max(6px, env(safe-area-inset-top));
          left: max(6px, env(safe-area-inset-left));
          right: auto;
          /* Shrink-wrap the portrait so the badge stays on its corner. */
          width: auto;
          z-index: 25;
        }
        #leader-avatar .leader-avatar-label {
          display: none;
        }
        /* Match the height of the top bar next to it (--topbar-h is measured in
           ui.ts, since the bar's height depends on how its pills wrap), and let
           the leaders' native 1.6:2 ratio set the width. The 75px ceiling keeps
           the portrait inside the 72px gutter the top bar's `left` reserves. */
        #leader-avatar > img {
          display: block;
          height: clamp(52px, var(--topbar-h, 60px), 75px);
          width: auto;
          aspect-ratio: 1.6 / 2;
          max-width: none;
          max-height: none;
          object-fit: cover;
          flex-shrink: 0;
          border-radius: 8px;
        }
        #bottom-bar {
          position: fixed;
          display: flex;
          align-items: center;
          gap: 4px;
          bottom: max(6px, env(safe-area-inset-bottom));
          left: max(6px, env(safe-area-inset-left));
          right: auto;
          top: auto;
          padding: 4px 6px;
          border-radius: 10px;
          z-index: 25;
          transform: none;
        }
        .bb-grp {
          display: flex;
          gap: 4px;
        }
        .bb-chip,
        .bb-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 3px;
          min-width: 28px;
          height: 32px;
          padding: 0 4px;
          border-radius: 999px;
          background: rgba(201, 162, 39, 0.08);
          border: 1px solid var(--edge);
          color: var(--parchment);
          font: inherit;
          font-size: 10px;
          line-height: 1;
          cursor: pointer;
          user-select: none;
          position: relative;
          overflow: hidden;
        }
        .bb-chip {
          cursor: default;
          background: rgba(201, 162, 39, 0.05);
        }
        .bb-btn::after {
          content: "";
          position: absolute;
          left: 0;
          bottom: 0;
          height: 2px;
          width: var(--p, 0%);
          background: var(--accent);
        }
        .bb-btn[data-bb="civics"]::after {
          background: #c07ad0;
        }
        .bb-btn i {
          font-style: normal;
          color: var(--parchment-dim);
          font-size: 10px;
        }
        /* Mobile: all three docked info panels share the bottom slot, stretch
           full-width, and collapse to just their summary bar (the .panel.collapsed
           rule above) so a selection no longer eats half the screen. */
        #unit-panel,
        #tile-panel,
        #city-panel {
          left: max(6px, env(safe-area-inset-left));
          right: max(6px, env(safe-area-inset-right));
          width: auto;
          min-width: 0;
          top: auto;
          bottom: calc(54px + env(safe-area-inset-bottom));
          max-height: min(46vh, 320px);
          overflow: auto;
          z-index: 10;
        }
        #endturn {
          right: max(6px, env(safe-area-inset-right));
          left: auto;
          bottom: max(6px, env(safe-area-inset-bottom));
          transform: none;
          width: 40px;
          height: 40px;
        }
        #endturn2 {
          right: calc(52px + env(safe-area-inset-right));
          left: auto;
          bottom: max(6px, env(safe-area-inset-bottom));
          transform: none;
          width: 28px;
          height: 28px;
        }
        #tutorial-coach-panel {
          right: max(6px, env(safe-area-inset-right));
          /* Sit above the docked unit / tile / city panel (bottom 54px, collapsed
             to a ~50px summary bar on mobile) so the coach never overlaps it. */
          bottom: calc(118px + env(safe-area-inset-bottom));
          max-width: min(380px, calc(100vw - 20px));
          gap: 10px;
        }
        #tutorial-coach-dialog {
          padding: 10px 12px 8px;
        }
        #tutorial-coach-tail {
          right: -12px;
          bottom: 28px;
          width: 14px;
          height: 18px;
        }
        #tutorial-coach-portrait {
          width: 112px;
          max-height: min(190px, 38vh);
        }
        #tutorial-coach-text {
          font-size: 13px;
          line-height: 1.4;
          min-height: 2.6em;
        }
        /* speakThenHide steps: bubble clears after the line is spoken so city UI is free. */
        #tutorial-coach.coach-action-ready #tutorial-coach-panel {
          display: none;
        }
        #research,
        #civics,
        #religion,
        #production,
        #specialists,
        #training,
        #save-modal {
          width: calc(100% - 20px);
          max-width: calc(100% - 20px);
        }
        #great-people,
        #legends {
          width: calc(100% - 16px);
          max-width: calc(100% - 16px);
          max-height: calc(100% - 76px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }
        #great-people .gp-portrait {
          width: 80px;
          height: 100px;
        }
        #great-people .gp-portrait-sm {
          width: 58px;
          height: 72px;
        }
        #great-people .gp-card b,
        #great-people .gp-progress-body b {
          font-size: 16px;
        }
        #great-people .sub {
          font-size: 13px;
        }
        #legends .legend-portrait {
          width: 80px;
          height: 100px;
        }
        #legends .legend-portrait-sm {
          width: 58px;
          height: 72px;
        }
        #legends .legend-card b {
          font-size: 16px;
        }
        #legends .sub {
          font-size: 13px;
        }
        /* Narrow screens stack the progress rail above a single-column hero list. */
        #legends .legends-layout {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        #legends .legend-grid {
          grid-template-columns: 1fr;
        }
        #save-modal {
          padding: 12px;
        }
        #save-modal .btn:not(.dialog-x) {
          width: 100%;
        }
        #log {
          top: calc(56px + env(safe-area-inset-top));
          left: max(6px, env(safe-area-inset-left));
          max-width: 60vw;
          font-size: 11px;
        }
        #tile-tip {
          display: none;
        }
        .btn {
          padding: 9px 13px;
        }
        #turn-update-dialog {
          width: min(340px, calc(100% - 24px));
          max-height: min(70dvh, calc(100% - 48px));
          padding: 14px 16px;
          top: 42%;
        }
        #turn-update-dialog .turn-update-art {
          width: 130px;
          height: 162px;
        }
        #turn-update-dialog .turn-update-msg {
          font-size: 13px;
        }
        #turn-update-dialog .tu-row-art {
          width: 40px;
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
