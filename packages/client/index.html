<!doctype html>
<html lang="en">
  <head>
    <script>
      window.__ROC_BOOT_ROUTE__ = (function () {
        var q = new URLSearchParams(location.search);
        var page = q.get("page");
        if (page === "support" || page === "privacy" || page === "terms" || page === "delete-account") return page;
        var path = location.pathname.replace(/\/$/, "").toLowerCase();
        var leaf = path.split("/").pop() || "";
        if (leaf === "privacy" || leaf === "privacy.html") return "privacy";
        if (leaf === "terms" || leaf === "terms.html") return "terms";
        if (leaf === "delete-account" || leaf === "delete-account.html") return "delete-account";
        if (leaf === "support" || leaf === "support.html") return "support";
        return null;
      })();
      window.__ROC_PHONE_SHELL__ = (function () {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var short = Math.min(w, h);
        var long = Math.max(w, h);
        var coarse = window.matchMedia("(pointer: coarse)").matches;
        if (short <= 540 && coarse) return true;
        if (short <= 540 && long <= 960) return true;
        return false;
      })();
      if (window.__ROC_PHONE_SHELL__) {
        document.documentElement.classList.add("roc-phone-shell");
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A turn-based 4X strategy game from the Ancient Era to the Age of Exploration."
    />
    <meta name="theme-color" content="#0f0e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rise of Civ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>Rise of Civilizations</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --bg: #0f0e0b;
        --bg-elevated: #181610;
        --bg-card: #1f1c14;
        --panel: rgba(31, 28, 20, 0.94);
        --edge: rgba(201, 162, 39, 0.28);
        --accent: #c9a227;
        --accent-bright: #f0d878;
        --parchment: #e8dcc5;
        --parchment-dim: #b8aa8d;
        --danger: #8a2c2c;
        --success: #4a6e46;
        /* One title scale for every dialog that opens over the map. Full-screen
           pages (changelog, credits, roadmap, legal, support) keep their own
           larger page-title scale. */
        --dialog-title-size: 18px;
        /* The pinned ✕ is --dialog-x-size square, inset from the dialog's
           padding box, so it eats (right-inset + size) = 48px of the right edge.
           Titles reserve --dialog-x-gutter to clear it horizontally; headers
           reserve --dialog-x-size of height so body content, which scrolls,
           can't pass under it. */
        --dialog-x-size: 34px;
        --dialog-x-top: 12px;
        --dialog-x-right: 14px;
        --dialog-x-gutter: 44px;
        /* In-game overlay dialogs sit above the top bar (z-index 70). */
        --roc-overlay-z: 72;
        /* Every in-game dialog starts from the same place, whatever its
           height: hung from one top line on desktop (the research picker's
           anchor), vertically centered on mobile/tablet where the taller top
           bar would collide with an anchored dialog. --dialog-max-h keeps the
           bottom edge on screen in both modes. */
        --dialog-top: max(68px, calc(52px + env(safe-area-inset-top)));
        --dialog-transform: translateX(-50%);
        --dialog-max-h: calc(100vh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        /* Remapped when CSS orientation fallback rotates the page (see html.roc-want-*). */
        --roc-safe-top: env(safe-area-inset-top, 0px);
        --roc-safe-right: env(safe-area-inset-right, 0px);
        --roc-safe-bottom: env(safe-area-inset-bottom, 0px);
        --roc-safe-left: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--parchment);
      }
      body.roc-native {
        min-height: 100%;
        min-height: 100dvh;
        background: #0f0e0b;
        /* Dialog headers pad for safe-area; keep ✕ inset modest so it stays fully tappable. */
        --dialog-x-top: 10px;
      }
      /* Home-screen PWA (Add to Home Screen) — same inset treatment as native. */
      body.roc-standalone {
        min-height: 100%;
        min-height: 100dvh;
        background: #0f0e0b;
        --dialog-x-top: 10px;
      }
      /* Native / PWA lobby: #lobby is the scroll container (body stays overflow:hidden). */
      body.roc-lobby-open #lobby {
        touch-action: pan-y;
      }
      /* WebKit can deliver taps to the fullscreen canvas under the lobby. */
      body.roc-lobby-open #game {
        pointer-events: none !important;
      }
      /* iOS Safari and other mobile browsers cannot lock orientation in a tab.
         When the player picks Horizontal / Vertical, rotate the page in CSS. */
      @media (orientation: portrait) {
        html.roc-want-landscape {
          position: fixed;
          width: 100vh;
          height: 100vw;
          top: 0;
          left: 100vw;
          transform: rotate(90deg);
          transform-origin: top left;
          overflow: hidden;
          --roc-safe-top: env(safe-area-inset-left, 0px);
          --roc-safe-right: env(safe-area-inset-top, 0px);
          --roc-safe-bottom: env(safe-area-inset-right, 0px);
          --roc-safe-left: env(safe-area-inset-bottom, 0px);
        }
      }
      @media (orientation: landscape) {
        html.roc-want-portrait {
          position: fixed;
          width: 100vh;
          height: 100vw;
          top: 100vh;
          left: 0;
          transform: rotate(-90deg);
          transform-origin: top left;
          overflow: hidden;
          --roc-safe-top: env(safe-area-inset-right, 0px);
          --roc-safe-right: env(safe-area-inset-bottom, 0px);
          --roc-safe-bottom: env(safe-area-inset-left, 0px);
          --roc-safe-left: env(safe-area-inset-top, 0px);
        }
      }
      h1, h2, h3, h4 {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        margin: 0 0 0.4em;
      }
      #game {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        /* dvh tracks the *visible* viewport as the mobile browser's toolbar
           shows/hides; plain vh is locked to the larger viewport, leaving a
           black strip below the map. 100vh stays as the fallback above. */
        height: 100dvh;
        touch-action: none;
        background: var(--bg);
      }
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--parchment);
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 8px 16px;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .btn:hover {
        background: rgba(201, 162, 39, 0.12);
        border-color: var(--accent);
        color: var(--accent-bright);
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), #a6821f);
        border-color: transparent;
        color: #15120c;
      }
      .btn.primary:hover {
        background: linear-gradient(135deg, var(--accent-bright), var(--accent));
        color: #0f0e0b;
        box-shadow: 0 8px 24px rgba(201, 162, 39, 0.25);
      }
      /* Tile-improvement build buttons: name on top, yield preview beneath. */
      .imp-btn {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        border-radius: 12px;
        padding: 6px 12px;
        text-align: left;
      }
      .imp-btn .imp-name {
        line-height: 1.15;
      }
      .imp-prev {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0;
        opacity: 0.8;
      }
      .panel {
        position: fixed;
        isolation: isolate;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.5;
        user-select: none;
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }
      .panel.roc-dialog,
      [id].roc-dialog {
        z-index: var(--roc-overlay-z);
      }
      .panel b {
        color: var(--parchment);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      /* Top status bar — stretches from the leader avatar to the right edge */
      #topbar {
        top: max(6px, env(safe-area-inset-top));
        left: calc(96px + env(safe-area-inset-left));
        right: max(6px, env(safe-area-inset-right));
        transform: none;
        max-width: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 14px;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        z-index: 70;
      }
      #leader-avatar {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        width: 84px;
        z-index: 70;
        display: flex;
        flex-direction: column;
      }
      #leader-avatar.empty {
        display: none;
      }
      #leader-avatar {
        cursor: pointer;
      }
      #leader-avatar > img {
        width: 84px;
        /* Leader art is 1.6:2; derive the height so nothing gets cropped. */
        height: auto;
        aspect-ratio: 1.6 / 2;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--edge);
        background: var(--bg-card);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: border-color 0.15s;
      }
      #leader-avatar:hover > img {
        border-color: var(--accent-bright);
      }
      #leader-avatar .leader-avatar-label {
        margin-top: 4px;
        text-align: center;
        font-size: 10px;
        color: var(--parchment);
        line-height: 1.2;
      }
      #leader-avatar .leader-avatar-label span {
        display: block;
        color: var(--parchment-dim);
      }
      .tb-grp {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* The turn counter is a read-only pill sharing the score pill's chrome. */
      .tb-turn {
        cursor: default;
      }
      /* Overall-score pill that sits beside the turn counter (opens the standings). */
      .tb-turn b,
      .score-pill b {
        color: var(--accent-bright);
      }
      .tb-pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: inherit;
        color: var(--parchment);
        background: rgba(201, 162, 39, 0.08);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 5px 10px 7px;
        cursor: pointer;
        max-width: 160px;
        overflow: hidden;
      }
      .tb-pill b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tb-pill::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: var(--p, 0%);
        background: var(--accent);
        border-radius: 0 2px 2px 0;
      }
      .tb-pill.civic::after {
        background: #c07ad0;
      }
      .tb-pl {
        opacity: 0.8;
      }
      .tb-score {
        margin-left: 4px;
        font-size: 11px;
        color: var(--parchment-dim);
        font-weight: 600;
      }
      .tb-div {
        opacity: 0.5;
        margin: 0 2px;
      }
      .tb-pill.empire {
        background: rgba(201, 162, 39, 0.12);
        gap: 4px;
      }
      /* shared small text + cost chips used in panels/modals */
      .sub {
        color: var(--parchment-dim);
        font-size: 11.5px;
        line-height: 1.35;
      }
      .cost {
        color: var(--parchment);
        white-space: nowrap;
        font-size: 12px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      /* Selected-unit panel */
      #unit-panel {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        min-width: 180px;
        max-height: min(70vh, 520px);
        overflow: auto;
        z-index: 10;
      }
      /* Shared collapsible summary bar for the docked info panels (unit / tile /
         city). The bar is always the tap target that expands/collapses the panel;
         the detail body hides when the panel carries the .collapsed class. */
      .ip-summary {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        text-align: left;
      }
      .ip-icon {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        object-fit: contain;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
      }
      .ip-name {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ip-name b {
        color: var(--parchment);
      }
      .ip-stats {
        display: flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
        font-size: 12px;
        color: #9fc0dc;
      }
      .ip-stat {
        cursor: default;
        border-bottom: 1px dotted transparent;
      }
      .ip-stat:hover {
        color: var(--parchment);
        border-bottom-color: var(--parchment-dim);
      }
      /* Panel yield / action hover labels (native title= is unreliable over the HUD). */
      #stat-tip {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        background: rgba(8, 16, 26, 0.96);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.45;
        max-width: min(280px, calc(100vw - 24px));
        white-space: normal;
        color: var(--parchment);
        text-shadow: 0 1px 2px #000;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      }
      #stat-tip.hidden {
        display: none !important;
      }
      .ip-close {
        flex: 0 0 auto;
        padding: 2px 7px;
        font-size: 13px;
      }
      .ip-chevron {
        flex: 0 0 auto;
        color: var(--parchment-dim);
        transition: transform 0.15s ease;
      }
      .panel:not(.collapsed) .ip-chevron {
        transform: rotate(180deg);
      }
      .panel.collapsed .ip-detail {
        display: none;
      }
      /* Quick-cast ability icons — sit inline in the collapsed summary bar (beside
         the name/stats) so a unit's abilities can be fired without expanding and
         without adding any extra height. Hidden when expanded, where the full
         labelled buttons live. */
      .ip-quick {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel:not(.collapsed) .ip-quick {
        display: none;
      }
      .ip-quick-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 5px;
        line-height: 1;
      }
      .panel:not(.collapsed) .ip-detail {
        margin-top: 10px;
      }
      .panel.collapsed {
        max-height: none !important;
        overflow: visible !important;
      }
      /* Selected-tile panel (shares the bottom-left slot with the unit panel) */
      #tile-panel {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 300px;
        z-index: 10;
      }
      /* Tile names ("Grassland · Barbarian Camp") are long; let the summary bar
         title wrap to a second line here instead of truncating with an ellipsis. */
      #tile-panel .ip-name {
        white-space: normal;
        overflow: visible;
      }
      .tinfo-yields {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 6px;
        padding: 6px 8px;
        background: rgba(201, 162, 39, 0.08);
        border-radius: 8px;
      }
      .tinfo-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        line-height: 1.5;
      }
      .tinfo-list li {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .tinfo-good {
        color: #a3d9a8;
      }
      .tinfo-bad {
        color: #e0a69a;
      }
      .tinfo-neutral {
        color: var(--parchment-dim);
      }
      #tile-panel .tinfo-toggle {
        margin-top: 8px;
        width: 100%;
      }
      /* Hover tooltip — limited tile info, docked in the bottom-right corner
         so it never covers the map under the cursor */
      #tile-tip {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 30;
        pointer-events: none;
        background: rgba(8, 16, 26, 0.92);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 11px;
        font-size: 13px;
        line-height: 1.35;
        white-space: nowrap;
        text-shadow: 0 1px 2px #000;
      }
      #tile-tip b {
        color: #fff;
      }
      #tile-tip .tt-rough {
        color: #e0b07d;
      }
      #tile-tip .tt-open {
        color: var(--parchment-dim);
      }
      /* City panel */
      #city-panel {
        right: max(12px, env(safe-area-inset-right));
        top: calc(var(--topbar-h, 68px) + var(--roc-safe-top, env(safe-area-inset-top, 0px)) + 8px);
        width: 320px;
        max-height: min(
          calc(100dvh - var(--topbar-h, 68px) - var(--roc-safe-top, env(safe-area-inset-top, 0px)) - 16px),
          820px
        );
        overflow: auto;
        z-index: 10;
      }
      .ygrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 10px;
        margin-top: 6px;
        padding: 5px 8px;
        background: rgba(201, 162, 39, 0.08);
        border-radius: 8px;
      }
      /* Compact rows inside the docked panels */
      .cline {
        margin-top: 6px;
        font-size: 12px;
        color: #9fc0dc;
      }
      .cline b {
        color: var(--parchment);
      }
      /* Secondary button that opens a sub-dialog (Choose Production / Specialists) */
      .csheet-btn {
        width: 100%;
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        text-align: left;
      }
      /* Left group: a fixed-width icon cell keeps every label's text starting at the
         same x, so "Construction / Train Units / Specialists" line up in a column. */
      .csheet-btn .cs-l {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .csheet-btn .ci {
        flex: 0 0 1.35em;
        text-align: center;
        font-size: 15px;
      }
      .csheet-btn .sub {
        font-weight: 400;
        color: #cfe3f7;
        flex: 0 0 auto;
      }
      /* Build-progress line with rush buttons tucked to the right of the label. */
      .build-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .build-row > span:first-child {
        min-width: 0;
      }
      .rush-inline {
        display: inline-flex;
        gap: 4px;
        flex: 0 0 auto;
      }
      .rush-mini {
        padding: 3px 7px;
        font-size: 11px;
        white-space: nowrap;
      }
      /* Tab bar for the construction dialog */
      .ptabs {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .ptab {
        flex: 1;
        padding: 7px 4px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        text-align: center;
      }
      .ptab.active {
        background: rgba(201, 162, 39, 0.16);
        border-color: var(--accent);
        color: var(--parchment);
      }
      #endturn2 {
        position: fixed;
        left: calc(50% + 10px);
        transform: none;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 70;
        width: 34px;
        height: 34px;
      }
      .action-btn {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        cursor: pointer;
        padding: 0;
        transition: filter 0.08s ease, transform 0.08s ease;
      }
      .action-btn:hover {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.28)) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.4));
        transform: translateY(-1px);
      }
      .action-btn:active {
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.15)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
        transform: translateY(1px);
      }
      .action-next {
        background-image: url("/ui/btn_next_move.png");
      }
      .action-skip {
        background-image: url("/ui/btn_skip_move.png");
      }
      #city-panel select {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--parchment);
        border: 1px solid var(--edge);
      }
      .bar {
        height: 8px;
        background: rgba(201, 162, 39, 0.15);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      /* End turn / next move buttons */
      #endturn {
        position: fixed;
        left: calc(50% - 44px);
        transform: none;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 70;
      }
      #endturn:disabled,
      #endturn2:disabled {
        opacity: 0.55;
        pointer-events: none;
      }
      /* Victory / defeat overlay */
      #gameover {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: rgba(15, 14, 11, 0.92);
        z-index: 60;
        text-align: center;
      }
      #gameover .go-panel {
        display: flex;
        flex-direction: column;
        width: min(520px, 100%);
        max-height: min(88vh, calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(36, 32, 24, 0.98), rgba(22, 20, 16, 0.98));
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #gameover .go-scroll {
        flex: 1;
        overflow: auto;
        padding: 22px 20px 12px;
      }
      #gameover .title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: clamp(28px, 7vw, 40px);
        font-weight: 800;
        color: var(--accent-bright);
        margin-bottom: 8px;
      }
      #gameover .sub {
        color: var(--parchment);
        font-size: 15px;
        line-height: 1.45;
        margin-bottom: 18px;
      }
      #gameover .go-section-title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #c9a227;
        margin: 16px 0 10px;
        text-align: left;
      }
      #gameover .go-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        text-align: left;
      }
      #gameover .go-stat {
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
      }
      #gameover .go-stat-label {
        font-size: 11px;
        color: #9fc0dc;
        margin-bottom: 4px;
      }
      #gameover .go-stat-value {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--parchment);
        line-height: 1.1;
      }
      #gameover .go-stat-hint {
        font-size: 10px;
        color: #9fc0dc;
        margin-top: 4px;
      }
      #gameover .go-standings {
        text-align: left;
      }
      #gameover .go-row {
        width: 100%;
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      #gameover .go-row:hover {
        border-color: rgba(201, 162, 39, 0.55);
        background: rgba(201, 162, 39, 0.06);
      }
      #gameover .go-row.go-row-selected {
        border-color: #c9a227;
        background: rgba(201, 162, 39, 0.12);
        box-shadow: inset 0 0 0 1px rgba(201, 162, 39, 0.25);
      }
      #gameover .go-portrait-wrap {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        overflow: hidden;
        flex-shrink: 0;
        background: rgba(0, 0, 0, 0.25);
      }
      #gameover .go-civ-portrait {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #gameover .go-civ-portrait-fallback {
        width: 100%;
        height: 100%;
      }
      #gameover .go-hint {
        margin-top: 10px;
        font-size: 12px;
        color: #9fc0dc;
        text-align: left;
        font-style: italic;
      }
      #gameover .go-vic {
        text-align: left;
      }
      #gameover .go-vic-won {
        border: 1px solid #c9a227;
        border-radius: 10px;
        background: rgba(201, 162, 39, 0.1);
        padding: 8px 10px;
      }
      #gameover .go-actions {
        display: flex;
        gap: 10px;
        padding: 14px 16px max(14px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--edge);
        background: rgba(0, 0, 0, 0.18);
      }
      #gameover .go-actions .btn {
        flex: 1;
        font-size: 15px;
        padding: 12px 14px;
      }
      #gameover-explore-bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(14px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(15, 14, 11, 0.92);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        z-index: 61;
      }
      #gameover-explore-bar .btn {
        font-size: 14px;
        padding: 10px 16px;
        white-space: nowrap;
      }
      #game-hud.game-over-map #topbar,
      #game-hud.game-over-map #endturn,
      #game-hud.game-over-map #endturn2,
      #game-hud.game-over-map #log,
      #game-hud.game-over-map #tile-tip:not(.hidden),
      #game-hud.game-over-map #empire:not(.hidden),
      #game-hud.game-over-map #empire-overlay:not(.hidden),
      #game-hud.game-over-map #diplomacy:not(.hidden),
      #game-hud.game-over-map #diplomacy-overlay:not(.hidden) {
        display: none !important;
      }
      /* Research / civics / religion / great people / production / save modal */
      #save-modal {
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: 320px;
        max-height: min(80vh, var(--dialog-max-h));
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* Top-bar pickers: below the status bar so the map and end-turn stay reachable */
      #research,
      #civics,
      #religion {
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: 320px;
        max-height: min(420px, calc(100vh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        overflow: hidden;
      }
      /* Research grows to the standard 80% on desktop so long tech lists don't
         squeeze into a stubby 420px box. It also gets extra width so the
         "Choose research" title clears the close + "View full" buttons on one line. */
      #research {
        width: min(460px, calc(100vw - 24px));
        max-height: min(80vh, var(--dialog-max-h));
      }
      /* Great People & Legends — richer cards, wider/taller panels. */
      #great-people,
      #legends {
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: min(440px, calc(100vw - 24px));
        max-height: var(--dialog-max-h);
        overflow: hidden;
      }
      /* Legends earns extra width on desktop: progress on the left, a grid of
         hero cards on the right. Mobile narrows it back below. */
      #legends {
        width: min(980px, calc(100vw - 32px));
      }
      /* Great People likewise: recruited figures on the left, class-progress
         grid on the right. Mobile narrows it back below. */
      #great-people {
        width: min(860px, calc(100vw - 32px));
      }
      /* Governments & Civics: governments on the left, civics on the right.
         Wider and taller than the default picker box. Mobile narrows it below. */
      #civics {
        width: min(900px, calc(100vw - 32px));
        max-height: calc(100vh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      #production,
      #specialists,
      #training,
      #gold-dialog,
      #morale-dialog,
      #log-dialog,
      #leaderboard-dialog {
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: min(520px, calc(100vw - 32px));
        max-height: min(80vh, var(--dialog-max-h));
        overflow: hidden;
      }
      #leaderboard-dialog {
        width: min(560px, calc(100vw - 32px));
      }
      #production,
      #specialists,
      #training {
        width: 320px;
      }
      #god-panel {
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: min(320px, calc(100vw - 32px));
        max-height: min(520px, var(--dialog-max-h));
      }
      #god-panel select.lobby-in,
      #god-panel select {
        flex: 1;
        min-width: 0;
        width: 100%;
        margin: 0;
        padding: 8px 10px;
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        color: var(--parchment);
        background-color: var(--bg-card);
        border: 1px solid var(--edge);
        color-scheme: dark;
      }
      #god-panel select option {
        color: var(--parchment);
        background-color: var(--bg-card);
      }
      #save-modal input.lobby-in {
        font: inherit;
        font-size: 13px;
        color: var(--parchment);
        background: var(--bg-card);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 7px 10px;
        user-select: text;
        -webkit-user-select: text;
      }
      .tech .sub {
        margin-top: 2px;
      }
      .tech .cost {
        margin-left: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
      }
      /* Turns-to-complete estimate under each tech's science cost. */
      .tech .cost .tech-eta {
        margin-top: 0;
        font-size: 10.5px;
        white-space: nowrap;
      }
      #production,
      #specialists,
      #training,
      #gold-dialog,
      #morale-dialog,
      #log-dialog,
      #leaderboard-dialog,
      #god-panel,
      #research,
      #civics,
      #religion,
      #great-people,
      #legends {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-dialog-header {
        flex: none;
      }
      .panel-dialog-header .row > b {
        min-width: 0;
        padding-right: 8px;
      }
      .panel-dialog-body {
        flex: 1;
        overflow: auto;
        margin-top: 8px;
        padding-right: 2px;
        min-height: 0;
      }
      /* Train-units building families — header-only until expanded */
      .train-fold {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        margin-top: 8px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.15);
        cursor: pointer;
        font: inherit;
        color: var(--parchment);
        text-align: left;
      }
      .train-fold:hover {
        background: rgba(201, 162, 39, 0.1);
        border-color: var(--accent);
      }
      .train-fold-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .train-fold-label b {
        color: var(--parchment);
      }
      .train-fold .train-chevron {
        flex: 0 0 auto;
        opacity: 0.7;
        transition: transform 0.15s;
      }
      .train-fold.open .train-chevron {
        transform: rotate(90deg);
      }
      .train-fold-body {
        display: none;
        padding: 6px 0 4px 4px;
      }
      .train-fold.open + .train-fold-body {
        display: block;
      }
      /* production cards */
      .pcard {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        margin-top: 7px;
        cursor: pointer;
      }
      .pcard:hover {
        background: rgba(201, 162, 39, 0.1);
        border-color: var(--accent);
      }
      .pcard.locked {
        cursor: default;
        opacity: 0.5;
        border-style: dashed;
      }
      .pcard.locked:hover {
        background: none;
        border-color: var(--edge);
      }
      .locked-note {
        margin-top: 10px;
        padding: 10px 12px;
        background: rgba(138, 44, 44, 0.12);
        border: 1px solid rgba(138, 44, 44, 0.4);
        border-radius: 8px;
        color: #e6d2b8;
        font-size: 13px;
      }
      /* Full tech tree */
      #techtree {
        position: fixed;
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: 94vw;
        height: min(88vh, var(--dialog-max-h));
        max-height: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        z-index: 41;
      }
      #techtree > div:first-child,
      #techtree .panel-dialog-header {
        flex: none;
      }
      #techtree .tt-scroll {
        margin-top: 8px;
      }
      #techtree > div:last-child,
      #techtree .panel-dialog-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      .tt-node {
        position: absolute;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 12px;
        border: 2px solid var(--edge);
        background: var(--bg-card);
        overflow: hidden;
      }
      .tt-name {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tt-cost {
        font-size: 11px;
        color: var(--parchment-dim);
      }
      .tt-unlocks {
        margin-top: 3px;
        font-size: 10.5px;
        line-height: 1.3;
        color: var(--parchment-dim);
        max-height: 40px;
        overflow: hidden;
      }
      .tt-done {
        border-color: #4a9a4e;
        background: rgba(74, 158, 78, 0.12);
      }
      .tt-researching {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.25);
      }
      .tt-available {
        border-color: var(--accent);
        cursor: pointer;
      }
      .tt-available:hover {
        background: rgba(201, 162, 39, 0.1);
      }
      .tt-queued {
        border-color: var(--accent);
        border-style: dashed;
        cursor: pointer;
      }
      .tt-queued:hover {
        background: rgba(201, 162, 39, 0.08);
      }
      .tt-locked {
        opacity: 0.5;
      }
      /* edges */
      .tt-edge {
        stroke: #3a5269;
        opacity: 0.5;
        transition: opacity 0.1s, stroke 0.1s;
      }
      .tt-edge-done {
        stroke: #4a8a4e;
        opacity: 0.75;
      }
      .tt-edge-hl {
        stroke: #ffd967 !important;
        opacity: 1 !important;
        stroke-width: 3 !important;
      }
      .tt-edge-dim {
        opacity: 0.06 !important;
      }
      /* prerequisite-chain highlight */
      .tt-node.tt-hl {
        opacity: 1 !important;
        border-color: #ffd967 !important;
        box-shadow: 0 0 0 2px rgba(255, 217, 103, 0.35);
        z-index: 2;
      }
      .tt-node.tt-dim {
        opacity: 0.16 !important;
      }
      /* Your civilization's unique unlocks (unit / building / leader ability).
         A violet outline + crown badge mark the tech, and the unlock entry
         itself is tinted so it reads as civ-specific. Uses outline (not border)
         so the node's status colour still shows through. */
      .tt-node.tt-civ {
        outline: 2px solid rgba(199, 146, 234, 0.85);
        outline-offset: 1px;
      }
      .tt-civ .tt-name {
        padding-right: 18px;
      }
      .tt-civ-badge {
        position: absolute;
        top: 5px;
        right: 7px;
        font-size: 12px;
        line-height: 1;
        pointer-events: none;
      }
      .tt-unlocks .tt-civ-unlock {
        color: #dcbcff;
        font-weight: 600;
      }
      .csub {
        margin-top: 10px;
        margin-bottom: 2px;
        color: var(--accent-bright);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #civics .row {
        gap: 6px;
      }
      /* Stat line that carries the governor chip on its right edge. */
      .cline-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .cline-hdr > span:first-child {
        min-width: 0;
      }
      .cline-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }
      /* Small round icon button on the stat line (e.g. the expand-tile flag). */
      .mini-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 7px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .mini-btn:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .mini-btn.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
      }
      /* Bombard button pulses subtly when a shot is available this turn. */
      .mini-btn.bombard-ready {
        border-color: #e0763d;
        background: rgba(224, 118, 61, 0.16);
      }
      .mini-btn.bombard-ready:hover {
        border-color: #ff8a4a;
        background: rgba(224, 118, 61, 0.28);
      }
      .mini-btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Collapsed governor control: a single pill showing the active mode; tapping it
         expands the full picker (.gov-row) below. Keeps the panel compact by default. */
      .gov-chip {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .gov-chip .gi {
        font-size: 13px;
      }
      .gov-chip .gov-caret {
        color: var(--parchment-dim);
        font-size: 9px;
      }
      .gov-chip:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .gov-chip.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
      }
      /* Governor (city auto-mode) picker: a compact 5-across segmented control
         that stays one tidy row on both the 300px desktop panel and the
         full-width mobile bottom sheet — icon over a short label. */
      .gov-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin-top: 4px;
      }
      .gov-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 7px 2px;
        min-height: 44px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(201, 162, 39, 0.06);
        color: var(--parchment-dim);
        font: inherit;
        font-size: 10px;
        line-height: 1.1;
        cursor: pointer;
        user-select: none;
        text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .gov-btn .gi {
        font-size: 15px;
        line-height: 1;
      }
      .gov-btn:hover {
        border-color: var(--accent);
        color: var(--parchment);
      }
      .gov-btn.active {
        background: rgba(201, 162, 39, 0.18);
        border-color: var(--accent);
        color: var(--parchment);
        font-weight: 700;
      }
      .gov-note {
        margin-top: 5px;
        font-size: 11px;
        color: #9fc0dc;
      }
      .tech {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        margin-top: 6px;
        cursor: pointer;
      }
      .tech:hover {
        background: rgba(201, 162, 39, 0.1);
      }
      .portrait-thumb {
        width: 44px;
        height: 55px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--edge);
        margin-right: 8px;
        flex-shrink: 0;
      }
      /* Governments & Civics panel — two columns, with a clear split between what
         you hold now and what you can research/adopt. */
      #civics .gc-bank {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 4px;
        padding: 8px 12px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(201, 162, 39, 0.1);
        font-size: 13px;
        color: var(--parchment);
      }
      #civics .gc-bank b {
        font-size: 15px;
        color: #ffd967;
      }
      #civics .gc-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: start;
        margin-top: 8px;
      }
      #civics .gc-col {
        min-width: 0;
      }
      /* The government/civics you currently hold: a highlighted panel, set apart
         from the researchable/adoptable rows below. */
      #civics .gc-current {
        margin-top: 4px;
        padding: 11px 12px;
        border: 1px solid rgba(255, 217, 103, 0.5);
        border-radius: 12px;
        background: rgba(39, 51, 29, 0.55);
      }
      #civics .gc-research {
        margin-top: 4px;
        padding: 11px 12px;
        border: 1px solid #ffd967;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.15);
      }

      #leader-ability-overlay {

      }
      #leader-ability-dialog {
        position: fixed;
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: min(400px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 18px 20px;
        text-align: center;
        opacity: 0;
        pointer-events: none;

      }

      #leader-ability-dialog .la-dialog-effect {

        line-height: 1.5;

      }
      #leader-ability-dialog .la-dialog-foot {
        font-size: 12px;
        color: var(--muted, #9a8c78);

        font-weight: 600;
        color: #7ee787;

        font-size: 13px;
        color: #d9b44a;
        margin-top: 12px;

      #leader-ability-dialog .la-dialog-actions {

      #leaderboard-content {

        overflow: auto;

        display: none;
      }
      .lb-caption {
        font-size: 12px;
        color: #9fc0dc;
        margin-bottom: 12px;
      }
      .lb-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lb-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 9px 11px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
      }
      /* The primary line: rank, colour swatch, name/civ, and the total score. */
      .lb-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lb-row.lb-self {
        border-color: #c9a227;
        background: rgba(201, 162, 39, 0.1);
      }
      .lb-row.lb-dead {
        opacity: 0.5;
      }
      .lb-rank {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 15px;
        color: var(--parchment);
        width: 22px;
        text-align: center;
        flex-shrink: 0;
      }
      .lb-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .lb-name {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }
      /* Name + Encyclopedia icon share one line; the sub sits beneath. */
      .lb-name-line {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .lb-name b {
        color: var(--parchment);
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .lb-wiki {
        flex: 0 0 auto;
        padding: 1px 6px !important;
        font-size: 11px !important;
        line-height: 1.1 !important;
        min-height: 0;
      }
      .lb-sub {
        font-size: 11px;
        color: #9fc0dc;
      }
      .lb-you {
        font-size: 10px;
        font-weight: 700;
        color: #15120c;
        background: #c9a227;
        border-radius: 999px;
        padding: 1px 6px;
        margin-left: 4px;
        vertical-align: middle;
      }
      .lb-fallen {
        font-size: 10px;
        font-weight: 700;
        color: #ff8a8a;
        border: 1px solid rgba(255, 138, 138, 0.5);
        border-radius: 999px;
        padding: 1px 6px;
        margin-left: 4px;
        vertical-align: middle;
      }
      /* Score breakdown on its own line beneath the main row, wrapping into a
         tidy strip rather than crammed between the name and the total. */
      .lb-detail {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 8px;
        font-size: 12px;
        color: #c8bda3;
        padding: 6px 2px 0 34px;
        border-top: 1px dashed rgba(255, 255, 255, 0.08);
      }
      .lb-detail span {
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 6px;
        padding: 1px 7px;
      }
      .lb-total {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 18px;
        color: #f0d878;
        width: 56px;
        text-align: right;
        flex-shrink: 0;
      }
      .lb-legend {
        font-size: 11px;
        color: #9fc0dc;
        margin-top: 12px;
        text-align: center;
      }
      .lb-vic-title {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--edge);
        font-weight: 700;
        color: var(--parchment);
      }
      .lb-vic {
        margin-top: 6px;
      }
      .lb-vic-row {
        margin-top: 10px;
      }
      .lb-vic-head {
        display: flex;
        justify-content: space-between;
      }
      html.roc-phone-shell .lb-detail {
        padding-left: 2px;
        font-size: 11px;
      }
      html.roc-phone-shell .lb-wiki {
        padding: 1px 5px !important;
        font-size: 10px !important;
        line-height: 1 !important;
        min-height: 0;
        margin-left: 2px;
      }
      /* gold ledger dialog (panel + .hidden; no separate overlay) */
      #gold-dialog-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        font-size: 13px;
        line-height: 1.5;
        color: var(--parchment);
      }
      .gold-section {
        margin-top: 14px;
      }
      .gold-section-title {
        font-weight: 700;
        color: var(--accent-bright);
        margin-bottom: 6px;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .gold-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .gold-row:last-child {
        border-bottom: none;
      }
      .gold-total {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        margin-top: 6px;
        border-top: 1px solid var(--edge);
        font-weight: 700;
      }
      .gold-amount {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .gold-positive {
        color: #5fcf61;
      }
      .gold-negative {
        color: #e0533d;
      }
      .gold-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .gold-treasury {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--accent-bright);
      }
      .gold-net {
        font-weight: 700;
        font-size: 14px;
      }
      /* The one top-right ✕ for every dialog that opens over the map: treasury,
         morale, diplomacy, empire, the city sub-dialogs, unique-unit cards. Add
         .dialog-title (or .panel-dialog-header) to the title beside it and the
         gutter is reserved for you. */
      /* Universal top-right ✕ for every .roc-dialog overlay. */
      .dialog-x {
        position: absolute;
        top: var(--dialog-x-top);
        right: var(--dialog-x-right);
        width: var(--dialog-x-size);
        height: var(--dialog-x-size);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--edge);
        background: var(--bg-card);
        color: var(--parchment);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: calc(var(--dialog-x-size) * 0.5);
        font-weight: 400;
        line-height: 1;
        cursor: pointer;
        touch-action: manipulation;
        overflow: visible;
        z-index: 10000;
        pointer-events: auto;
        transition: background 0.15s ease, color 0.15s ease;
      }
      /* The ✕ text is swapped for the generated ic_close art by iconify(). */
      .dialog-x .gi {
        width: calc(var(--dialog-x-size) * 0.46);
        height: calc(var(--dialog-x-size) * 0.46);
        vertical-align: middle;
        pointer-events: none;
      }
      .dialog-x::before {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: inherit;
        pointer-events: auto;
      }
      .dialog-x:hover {
        background: rgba(201, 162, 39, 0.14);
        color: var(--accent-bright);
      }
      .roc-dialog,
      #turn-update-dialog.roc-dialog,
      #settings-dialog.roc-dialog,
      #combat-preview-dialog.roc-dialog,
      #village-dialog.roc-dialog,
      #gp-activate-dialog.roc-dialog,
      #leader-ability-dialog.roc-dialog,
      #unit-promo-dialog.roc-dialog,
      #empire.roc-dialog,
      #diplomacy.roc-dialog {
        isolation: isolate;
      }
      /* Pinned ✕ + title row; scrolling body stays beneath it. */
      .dialog-head-band {
        flex: none;
        position: relative;
        flex-shrink: 0;
        min-height: calc(var(--dialog-x-top) + var(--dialog-x-size));
        padding-right: var(--dialog-x-gutter);
        margin-bottom: 12px;
        z-index: 2;
      }
      /* Every in-game dialog title, one scale. Keep this list and the header-band
         list below in sync when a dialog is added. */
      .dialog-title,
      .roc-dialog-head-title > b,
      .panel-dialog-header > b,
      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title,
      #settings-dialog .settings-head-title,
      #combat-preview-dialog .combat-preview-header b,
      #village-dialog .village-title,
      #gp-activate-dialog .gp-activate-title,
      #leader-ability-dialog .la-dialog-title,
      #turn-update-dialog .turn-update-title,
      .dp-title,
      .dc-title,
      .emp-title,
      .uud-title,
      .tutorial-prompt-title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: var(--dialog-title-size);
        font-weight: 700;
        color: var(--accent-bright);
      }
      /* In-flow header row: title + actions (View full, ✕) on one flex line. */
      .roc-dialog-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        min-height: calc(var(--dialog-x-top) + var(--dialog-x-size));
        padding-right: 0;
        overflow: visible;
        position: relative;
        z-index: 2;
      }
      .roc-dialog-head-title {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        pointer-events: none;
      }
      .roc-dialog-head:not(.roc-dialog-head--toolbar) .roc-dialog-head-title {
        text-align: center;
        padding-left: calc(var(--dialog-x-size) + 8px);
      }
      .roc-dialog-head--toolbar .roc-dialog-head-title {
        text-align: left;
        padding-left: 0;
      }
      .roc-dialog-head-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
        position: relative;
        z-index: 3;
      }
      .roc-dialog-head-actions > .dialog-x {
        position: relative;
        top: auto;
        right: auto;
        width: var(--dialog-x-size);
        height: var(--dialog-x-size);
        flex: none;
        z-index: 2;
      }
      /* In a toolbar row the neighbor is 12px away — don't bleed into it. */
      .roc-dialog-head-actions > .dialog-x::before {
        inset: 0;
      }
      .roc-dialog-head-actions .dialog-head-btn {
        position: relative;
        top: auto;
        right: auto;
        height: var(--dialog-x-size);
        padding: 0 12px;
        z-index: 1;
        flex: none;
      }
      /* Legacy pinned ✕ bands (empire, settings, art dialogs). */
      .dialog-title,
      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title,
      .emp-title,
      .dp-head,
      #combat-preview-dialog .combat-preview-header {
        min-height: calc(var(--dialog-x-top) + var(--dialog-x-size));
        padding-right: var(--dialog-x-gutter);
        overflow: visible;
        position: relative;
        z-index: 2;
        pointer-events: none;
      }
      /* Titles/subtitles must not steal ✕ taps on legacy pinned-✕ dialogs. */
      .dialog-title,
      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title,
      .emp-title,
      .dp-title,
      #settings-dialog .settings-head-title,
      #combat-preview-dialog .combat-preview-header b {
        pointer-events: none;
      }
      /* Header controls on legacy pinned-✕ dialogs. */
      .dialog-head-band .btn,
      .dialog-head-band button,
      .dialog-head-band a,
      .dialog-head-band input,
      .dialog-head-band select,
      #settings-dialog .settings-head-band .btn,
      #settings-dialog .settings-head-band button,
      #combat-preview-dialog .combat-preview-header .btn,
      #combat-preview-dialog .combat-preview-header button,
      .dp-head .btn,
      .dp-head button,
      .emp-title .btn,
      .emp-title button {
        pointer-events: auto;
      }
      /* Legacy title-only bands: centre against a pinned ✕ sibling. */
      .dialog-title,
      .log-dialog-title,
      .gold-dialog-title,
      .morale-dialog-title,
      .unit-promo-dialog-title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-left: var(--dialog-x-gutter);
      }
      /* Art-topped dialogs centre their title, and hide the art entirely when it
         fails to load, which lifts the title up beside the ✕. A symmetric gutter
         clears the button without pulling the text off centre. */
      #village-dialog .village-title,
      #gp-activate-dialog .gp-activate-title,
      #leader-ability-dialog .la-dialog-title {
        padding-left: var(--dialog-x-gutter);
        padding-right: var(--dialog-x-gutter);
      }
      /* Optional header action parked just left of the ✕ (legacy absolute layout). */
      .dialog-head-btn {
        position: absolute;
        top: var(--dialog-x-top);
        right: calc(var(--dialog-x-right) + var(--dialog-x-size) + 10px);
        height: var(--dialog-x-size);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        z-index: 50;
      }
      /* Morale dialog — panel + .hidden, same close wiring as Train Units. */
      #morale-overlay {
        display: none;
      }
      /* Single scroll region for the whole dialog body, so the content and the
         "how morale works" explainer never each get their own scrollbar. */
      .morale-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .morale-dialog-title {
        margin-bottom: 12px;
      }
      #morale-dialog-content {
        font-size: 13px;
        line-height: 1.5;
        color: var(--parchment);
      }
      .morale-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .morale-value {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
      }
      .morale-state {
        font-weight: 700;
        font-size: 14px;
        color: var(--parchment);
      }
      .morale-bar {
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-bottom: 6px;
      }
      .morale-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.3s ease;
      }
      .morale-pay-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .morale-pay-btn {
        flex: 1 1 auto;
        min-width: 44px;
        font-size: 12px;
        padding: 5px 6px;
      }
      .morale-pay-btn.active {
        background: rgba(126, 231, 135, 0.18);
        border-color: #7ee787;
        color: #7ee787;
      }
      .morale-explain-toggle {
        margin-top: 12px;
        align-self: flex-start;
        font-size: 12px;
        padding: 6px 12px;
      }
      .morale-explain {
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--parchment-dim);
        border-top: 1px solid var(--edge);
        padding-top: 8px;
      }
      .morale-explain p {
        margin: 0 0 8px;
      }
      .morale-explain b {
        color: var(--parchment);
      }
      #morale-dialog .btn.primary {
        margin-top: 14px;
        align-self: center;
      }
      /* Unit promotion info dialog */
      #unit-promo-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 14, 11, 0.72);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 60;
      }
      #unit-promo-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      #unit-promo-dialog {
        position: fixed;
        left: 50%;
        top: var(--dialog-top);
        transform: var(--dialog-transform);
        width: min(560px, calc(100vw - 32px));
        max-height: min(80vh, var(--dialog-max-h));
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 61;
      }
      #unit-promo-dialog.show {
        opacity: 1;
        pointer-events: auto;
      }
      .unit-promo-dialog-title {
        margin-bottom: 12px;
      }
      #unit-promo-dialog-content {
        flex: 1;
        overflow: auto;
        font-size: 13px;
        line-height: 1.5;
        color: var(--parchment);
      }
      .unit-perk-summary {
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--edge);
      }
      .unit-perk-section {
        margin-top: 14px;
      }
      .unit-perk-section-title {
        font-weight: 700;
        color: var(--accent-bright);
        margin-bottom: 8px;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .unit-perk-tier-block {
        margin-top: 12px;
      }
      .unit-perk-tier-head {
        font-weight: 700;
        color: var(--parchment);
        margin-bottom: 6px;
        font-size: 12px;
      }
      .unit-perk-tier {
        color: #ffd967;
        letter-spacing: 1px;
      }

      /* ---- mobile / narrow screens: panels become bottom sheets ---- */
      html.roc-phone-shell {

        --dialog-top: 50%;

        html.roc-phone-shell #gold-dialog,
