<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rise of Civilizations — Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14130f;
        --panel: #1f1c14;
        --edge: #3a3324;
        --ink: #e8dcc5;
        --muted: #b8aa8d;
        --gold: #c9a227;
        --gold-bright: #f0d878;
        --win: #6fbf73;
        --loss: #d07a6a;
        --abandon: #9a8f74;
        font-family: "Lato", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      a { color: var(--gold-bright); }
      .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 22px 60px; }
      h1 { font-family: "Cinzel", Georgia, serif; font-size: 26px; margin: 0; letter-spacing: .5px; }
      .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 20px; padding-bottom: 2px; border-bottom: 1px solid rgba(58,51,36,.75); }
      .nav-tab { display: inline-block; padding: 10px 16px; border-radius: 10px 10px 0 0; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; border: 1px solid transparent; border-bottom: none; margin-bottom: -1px; }
      .nav-tab:hover { color: var(--gold-bright); background: rgba(201,162,39,.06); }
      .nav-tab.active { color: var(--gold-bright); background: var(--panel); border-color: var(--edge); }
      .page-section { margin-top: 0; }
      .page-section.games-page { overflow: hidden; }
      .page-lead { margin: -6px 0 14px; }
      .btn { font: inherit; font-weight: 700; color: var(--ink); background: rgba(201,162,39,.1); border: 1px solid var(--edge); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
      .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
      .in { font: inherit; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 10px; padding: 9px 12px; min-width: 260px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 22px 0 12px; }
      .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; }
      .card .n { font-family: "Cinzel", Georgia, serif; font-size: 26px; font-weight: 800; color: var(--gold-bright); }
      .card .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
      .stat-line { font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
      .stat-sep { margin: 0 6px; opacity: .5; }
      section { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 18px; margin-top: 16px; }
      section h2 { font-family: "Cinzel", Georgia, serif; font-size: 17px; margin: 0 0 14px; color: var(--ink); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(58,51,36,.6); }
      th { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .data-table.compact td, .data-table.compact th { padding: 5px 10px; }
      .data-table.compact tbody tr:last-child td { border-bottom: none; }
      .data-table th.sortable { cursor: pointer; user-select: none; }
      .data-table th.sortable:hover, .data-table th.sorted { color: var(--gold-bright); }
      .data-table th { position: relative; vertical-align: bottom; }
      .th-inner { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
      .th-inner.num { justify-content: flex-end; width: 100%; }
      .th-label { line-height: 1.2; }
      .col-filter-btn { flex: 0 0 auto; font: inherit; font-size: 11px; line-height: 1; color: var(--muted); background: rgba(201,162,39,.08); border: 1px solid rgba(58,51,36,.8); border-radius: 4px; padding: 2px 5px; cursor: pointer; }
      .col-filter-btn:hover, .col-filter-btn.active { color: var(--gold-bright); border-color: var(--gold); background: rgba(201,162,39,.16); }
      .col-filter-pop { display: none; position: absolute; top: calc(100% - 2px); left: 6px; z-index: 20; min-width: 140px; padding: 6px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
      .data-table th.num .col-filter-pop { left: auto; right: 6px; }
      .col-filter-pop.open { display: block; }
      .col-filter-in { width: 100%; font: inherit; font-size: 12px; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 6px; padding: 6px 8px; }
      .col-filter-in:focus { outline: none; border-color: var(--gold); }
      .btn-link { font: inherit; font-size: inherit; color: var(--gold-bright); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; }
      .btn-link:hover { color: var(--gold); }
      tr.clickable-row { cursor: pointer; }
      tr.clickable-row:hover td { background: rgba(201,162,39,.06); }
      .bar-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 6px 0; font-size: 14px; }
      .bar-row .v { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .pill.win { background: rgba(111,191,115,.16); color: var(--win); }
      .pill.loss { background: rgba(208,122,106,.16); color: var(--loss); }
      .pill.abandoned { background: rgba(154,143,116,.16); color: var(--abandon); }
      .pill.tutorial { background: rgba(201,162,39,.14); color: var(--gold-bright); }
      .muted { color: var(--muted); }
      .err { color: var(--loss); margin-top: 10px; }
      .warn-banner { background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.45); border-radius: 12px; padding: 12px 14px; margin: 16px 0; color: var(--gold-bright); font-size: 13px; line-height: 1.45; }
      .warn-banner code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink); }
      .gate { max-width: 420px; margin: 60px auto; text-align: center; }
      .gate .in { width: 100%; margin: 14px 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .table-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .tb-in { font: inherit; font-size: 13px; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 160px; }
      .tb-in-wide { width: min(100%, 280px); flex: 1 1 200px; }
      .tb-sel { font: inherit; font-size: 13px; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; }
      .table-meta { font-size: 13px; margin-bottom: 8px; }
      .table-scroll { overflow-x: auto; border: 1px solid rgba(58,51,36,.6); border-radius: 10px; }
      .table-pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
      .table-pager .grow { flex: 1; }
      .table-pager select { font: inherit; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px; margin-left: 6px; }
      .table-pager .btn:disabled { opacity: .4; cursor: not-allowed; }
      .btn-sm { padding: 5px 10px; font-size: 12px; }
      .report-filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 16px; margin-bottom: 0; padding: 16px; background: rgba(0,0,0,.15); border: 1px solid rgba(58,51,36,.6); border-radius: 12px; }
      .report-filters-panel { display: none; margin-bottom: 18px; }
      .report-filters-panel.open { display: block; }
      .report-filter-bar { margin-bottom: 12px; }
      .report-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .report-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      .report-sel { width: 100%; }
      .report-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 4px; }
      .report-cards { margin-top: 4px; }
      .report-grid section { margin-top: 0; }
      .report-breakdown h3 { font-family: "Cinzel", Georgia, serif; font-size: 14px; margin: 0 0 10px; color: var(--ink); }
      .overview-page .dash-cards { margin-top: 0; }
      .dash-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
      .dash-grid section { margin-top: 0; }
      .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .section-head h2 { margin: 0; }
      .section-link { font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .section-link:hover { text-decoration: underline; }
      .pill.in-progress { background: rgba(184,170,141,.12); color: var(--muted); }
      .games-scope select { font: inherit; font-size: 13px; color: var(--ink); background: #15130d; border: 1px solid var(--edge); border-radius: 6px; padding: 3px 8px; margin-left: 6px; }
      .report-tutorial { margin-top: 26px; }
      .report-tutorial h3 { font-family: "Cinzel", Georgia, serif; font-size: 16px; margin: 0 0 10px; }
      .report-tutorial h4 { font-family: "Cinzel", Georgia, serif; font-size: 14px; margin: 18px 0 10px; color: var(--ink); }
      .report-tutorial .report-breakdown { max-width: 520px; }
      .report-sessions { margin-top: 28px; }
      .report-sessions h3 { font-family: "Cinzel", Georgia, serif; font-size: 16px; margin: 0 0 8px; }
      .report-sessions-lead { margin: 0 0 12px; font-size: 13px; }
      .game-modal-panel { max-width: 960px; width: 100%; margin: 0; background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 20px 22px; }
      .player-panels { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
      .player-panel { border: 1px solid rgba(58,51,36,.65); border-radius: 12px; padding: 12px 14px; background: rgba(0,0,0,.12); }
      .player-panel-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
      .player-panel-head .grow { flex: 1; min-width: 0; }
      .player-sub { font-size: 13px; margin-top: 2px; }
      .player-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px 12px; margin-bottom: 12px; font-size: 13px; }
      .player-stat { display: flex; flex-direction: column; gap: 2px; }
      .player-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; font-size: 13px; }
      .detail-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
      .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: rgba(201,162,39,.1); border: 1px solid rgba(201,162,39,.25); color: var(--ink); }
      .player-legacy { font-size: 13px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="app" class="wrap"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
